[package]
name = "ebpf-http-sniffer"
version = "0.1.0"
edition = "2021"
description = "Capture plaintext HTTP/1.x request/response traffic on Linux with eBPF"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "http-sniff"
path = "src/main.rs"

[dependencies]
ebpf-http-sniffer-common = { path = "ebpf-http-sniffer-common", features = ["user"] }

aya = "0.14"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }

[build-dependencies]
anyhow = "1"
aya-build = "0.2"

[workspace]
resolver = "2"
members = ["ebpf-http-sniffer-common", "ebpf-http-sniffer-ebpf"]

# The eBPF side runs inside the kernel verifier, so it always needs full
# optimisation - even in a debug build.
[profile.dev]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The eBPF program is a separate crate with its own target and toolchain; keep
# its debug info so `bpftool` and friends can name things.
[profile.release.package.ebpf-http-sniffer-ebpf]
debug = 2
codegen-units = 1
strip = false
